name: Validate Push Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify release tag
    runs-on: systemspurge-dpsim-runner
    outputs:
      python_publish: ${{ steps.classify.outputs.python_publish }}
      rewrite_version: ${{ steps.classify.outputs.rewrite_version }}
    steps:
      - id: classify
        shell: bash
        run: |
          run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == *rc* ]]; then
            echo "python_publish=testpypi" >> "$GITHUB_OUTPUT"
            echo "rewrite_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "python_publish=pypi" >> "$GITHUB_OUTPUT"
            echo "rewrite_version=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Release CI
    needs: [classify]
    uses: ./.github/workflows/ci-main.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ github.sha }}
      image_version: ${{ github.ref_name }}
      python_publish: ${{ needs.classify.outputs.python_publish }}
      rewrite_version: ${{ needs.classify.outputs.rewrite_version }}
      run_documentation: false
    secrets: inherit