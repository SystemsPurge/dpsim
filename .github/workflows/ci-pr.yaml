name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# TODO: Propagate this check:
  # github.event_name == 'pull_request'
  # && github.event.pull_request.head.repo.full_name == github.repository
  # || github.event_name == 'pull_request_target'
  # && github.event.pull_request.head.repo.full_name != github.repository

# TODO: Split build<=>promote, consider effect on secrets:
  # GITHUB_TOKEN ( documentation.yaml, build-images.yaml, LLM, Sonar and release-please should be safe ) split build/promote
  # DOCKER_USER/SECRET ( build-images.yaml ) split build/promote
  # CACHIX_AUTH_TOKEN ( build-nix.yaml ) read only on PR, else write
  # HUGO_ACTIONS_DEPLOY_KEY ( documentation.yaml ) purely into promote
  # CODECOV_TOKEN ( test-linux.yaml ) cant really do anything about this one
jobs:
  ci:
    name: PR CI
    uses: ./.github/workflows/ci-main.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      python_publish: testpypi
      rewrite_version: true
      run_documentation: false
    secrets: inherit
  