name: Build CI

on:
  workflow_call:
    inputs:
      #rebuild_images can actually just not be touched here
      #pr => push=false
      #merge => push=true
        #nightly release=>push=latest
        #stable release=>push=true
      push:
        description: |
          Controls publishing:
          - false: do not push
          - true: push versioned SHA tag
          - latest: push SHA tag and latest/legacy tags
        required: true
        type: string
      
      rebuild_images:
        description: |
          Controls image rebuild behavior:
          - auto: Automatically rebuild all if non-Docker code changed, else rebuild specific Docker changes
          - true: Force rebuild of all images
          - false: Only build specifically changed Dockerfiles
        required: false
        type: string
        default: 'auto'

      registries:
        description: JSON array of container registries to push to
        required: false
        type: string
        default: '["docker.io"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  ORGANIZATION: soullessblob
  LOCAL_REGISTRY: internal-registry.arc-systems.svc.cluster.local:5000
  IMAGE_SHA: ${{ github.sha }}
  DEV_DEPENDENTS: '["dpsim", "dpsim-rpm", "dpsim-shmem"]'

jobs:
  setup:
    name: Resolve images

    runs-on: systemspurge-dpsim-runner

    outputs:
      revision: ${{ steps.revision.outputs.revision }}
      image_repos: ${{ steps.images.outputs.image_repos }}
      has_dev: ${{ steps.images.outputs.has_dev }}
      registries: ${{ steps.config.outputs.registries }}
      push_latest: ${{ steps.config.outputs.push_latest }}
      push: ${{ steps.config.outputs.push }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail

          echo "revision=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Resolve configuration
        id: config
        shell: bash
        env:
          INPUT_REGISTRIES: ${{ inputs.registries }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          
          # ---- validate registries as array of string ----

          echo "${INPUT_REGISTRIES}" |
            jq -e '
              type == "array"
              and length > 0
              and all(.[]; type == "string")
            ' >/dev/null

          # ---- validate/convert push as one of true/false/latest ----

          case "${INPUT_PUSH}" in
            false)
              push=false
              push_latest=false
              ;;
            true)
              push=true
              push_latest=false
              ;;
            latest)
              push=true
              push_latest=true
              ;;
            *)
              echo "Invalid push value: ${INPUT_PUSH}. Expected false, true, or latest." >&2
              exit 1
              ;;
          esac
          echo "registries=${INPUT_REGISTRIES}" >> "${GITHUB_OUTPUT}"
          echo "push=${push}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Detect Docker image changes
        id: paths
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            docker:
              - 'packaging/Docker/Dockerfile.*'
            code_changed:
              - '**'
              - '!packaging/Docker/**'
              - '!.github/**'
              - '!**.md'
              - '!.gitignore'
              - '!LICENSE*'

      - name: Resolve images
        id: images
        shell: bash
        env:
          DOCKER_FILES: ${{ steps.paths.outputs.docker_files }}
          CODE_CHANGED: ${{ steps.paths.outputs.code_changed }}
          REBUILD_IMAGES: ${{ inputs.rebuild_images }}
          DEV_DEPENDENTS: ${{ env.DEV_DEPENDENTS }}
        run: |
          set -euo pipefail

          # ---- determine if a full rebuild is required ----

          if [[ "${REBUILD_IMAGES}" == "true" ]] || \
            ([[ "${REBUILD_IMAGES}" == "auto" ]] && [[ "${CODE_CHANGED}" == "true" ]]); then
            rebuild_all=true
          else
            rebuild_all=false
          fi

          if [[ "${rebuild_all}" == "true" ]]; then
          image_repos="$(
            find packaging/Docker \
              -maxdepth 1 \
              -type f \
              -name 'Dockerfile.*' \
              -printf '%f\n' |
            sed 's/^Dockerfile\.//' |
            sort -u |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | map(if . == "dpsim" then . else "dpsim-" + . end)
            '
          )"

          #----else detect what changed----

          else
            image_repos="$(
              jq -c '
                map(
                    sub("^packaging/Docker/Dockerfile\\."; "")
                    | if . == "dpsim" then . else "dpsim-" + . end
                )
              ' <<< "${DOCKER_FILES}"
            )"
          fi

          #----see if dev needs rebuilding----

          has_dev="$(jq -r 'contains(["dpsim-dev"])' <<< "${image_repos}")"

          #----add dependents if necessary ( consider inverted dependence here )----
          #----removing dev shouldnt be an issue, since has_dev determines whether dev build triggers----

          image_repos="$(
            jq -c --argjson dependents "${DEV_DEPENDENTS}" '
              if contains(["dpsim-dev"]) then
                (. + $dependents | unique) - ["dpsim-dev"]
              else
                .
              end
            ' <<< "${image_repos}"
          )"

          echo "has_dev=${has_dev}" >> "${GITHUB_OUTPUT}"
          echo "Image Repositories: ${image_repos}"
          echo "image_repos=${image_repos}" >> "${GITHUB_OUTPUT}"
  
  build-dev:
    name: Build & Cache dpsim-dev
    needs: setup
    if: needs.setup.outputs.has_dev == 'true'
    runs-on: systemspurge-dpsim-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Base Image to Local Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Docker/Dockerfile.dev
          tags: ${{ env.LOCAL_REGISTRY }}/${{ env.ORGANIZATION }}/dpsim-dev:${{ env.IMAGE_SHA }}
          push: true

  build:
    name: Build ${{ matrix.image_repo }}
    needs:
      - setup
      - build-dev
    if: | #this is pretty much if build-dev is skipped, but didnt fail
      always() &&
      needs.setup.outputs.image_repos != '[]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: systemspurge-dpsim-runner
    strategy:
      fail-fast: false
      matrix:
        image_repo: ${{ fromJSON(needs.setup.outputs.image_repos) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.revision }}

      - name: Build images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Docker/Dockerfile.${{ replace(matrix.image_repo, 'dpsim-', '') }}
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_REGISTRY }}/${{ env.ORGANIZATION }}/dpsim-dev:${{ env.IMAGE_SHA }}
          tags: |
            ${{ env.LOCAL_REGISTRY }}/${{ env.ORGANIZATION }}/${{ matrix.image_repo }}:${{ env.IMAGE_SHA }}
          push: true #temporarely push into LOCAL registry
  
  push-dev:
    name: Promote and push dev image
    needs:
      - setup
      - build-dev
      - build
    if: |
      always() &&
      needs.setup.outputs.has_dev == 'true' &&
      needs.setup.outputs.push == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: systemspurge-dpsim-runner
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(needs.setup.outputs.registries) }}
    steps:
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'docker.io' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ matrix.registry == 'docker.io' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull from Local and Push to Target Registry
        shell: bash
        env:
          REGISTRY: ${{ matrix.registry }}
          PUSH_LATEST: ${{ needs.setup.outputs.push_latest }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
        run: |
          set -euo pipefail

          local_image="${LOCAL_REGISTRY}/${ORGANIZATION}/dpsim-dev:${IMAGE_SHA}"
          base_image="${REGISTRY}/${ORGANIZATION}/dpsim-dev"
          sha_tagged="${base_image}:${IMAGE_SHA}"

          docker pull "${local_image}"

          docker tag "${local_image}" "${sha_tagged}"
          docker push "${sha_tagged}"

          if [[ "${PUSH_LATEST}" == "true" ]]; then
            docker tag "${local_image}" "${base_image}:latest"
            docker push "${base_image}:latest"

            transition_tag="${REGISTRY}/${ORGANIZATION}/dpsim:dev"
            docker tag "${local_image}" "${transition_tag}"
            docker push "${transition_tag}"
          fi

  push:
    name: Promote and push ${{ matrix.image_repo }} @ ${{ matrix.registry }}
    needs:
      - setup
      - build
    if: |
      always() &&
      needs.setup.outputs.image_repos != '[]' &&
      needs.setup.outputs.push == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: systemspurge-dpsim-runner
    strategy:
      fail-fast: false
      matrix:
        image_repo: ${{ fromJSON(needs.setup.outputs.image_repos) }}
        registry: ${{ fromJSON(needs.setup.outputs.registries) }}
    steps:
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'docker.io' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ matrix.registry == 'docker.io' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull from Local and Push to Target Registry
        shell: bash
        env:
          REGISTRY: ${{ matrix.registry }}
          IMAGE_REPO: ${{ matrix.image_repo }}
          PUSH_LATEST: ${{ needs.setup.outputs.push_latest }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
        run: |
          set -euo pipefail

          local_image="${LOCAL_REGISTRY}/${ORGANIZATION}/${IMAGE_REPO}:${IMAGE_SHA}"
          base_image="${REGISTRY}/${ORGANIZATION}/${IMAGE_REPO}"
          sha_tagged="${base_image}:${IMAGE_SHA}"

          docker pull "${local_image}"

          # ----always push SHA tag----

          docker tag "${local_image}" "${sha_tagged}"
          docker push "${sha_tagged}"

          # ----handle latest & legacy transition tags----

          if [[ "${PUSH_LATEST}" == "true" ]]; then

            # ----push :latest tag (e.g., sogno/dpsim-rpm:latest)----

            docker tag "${local_image}" "${base_image}:latest"
            docker push "${base_image}:latest"

            # ----push legacy transition tag for all non-dpsim repos (e.g., sogno/dpsim:rpm)----

            if [[ "${IMAGE_REPO}" != "dpsim" ]]; then
              transition_tag="${REGISTRY}/${ORGANIZATION}/dpsim:${IMAGE_REPO#*-}"
              docker tag "${local_image}" "${transition_tag}"
              docker push "${transition_tag}"
            fi
          fi